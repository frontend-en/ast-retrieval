version: '3.8'
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # браузер
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_security_auth__enabled=false
    volumes:
      - neo4j-data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

volumes:
  neo4j-data: